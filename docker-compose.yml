services:
  mongo:
    image: mongo:8.0
    container_name: fpl-radar-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Bound to loopback only: the local instance has no auth.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      # Initiates the single-node replica set on first run (idempotent), then
      # reports healthy only once this node is the writable primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })
          }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-config:
