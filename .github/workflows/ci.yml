name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # mongodb-memory-server binary (version pinned in server/package.json) cached across runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package.json', 'client/package.json') }}
      - run: npm ci
      # Build first: the production-process integration test serves client/dist.
      - run: npm run build
      - run: npm run check:bundle
      - run: npm test
      # Headless Chromium for the client's browser test (version pinned by playwright-core in client/package.json).
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:integration
